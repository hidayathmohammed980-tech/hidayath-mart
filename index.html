<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2874f0">
<link rel="manifest" href="manifest.json">
<title>Hidayath Mart</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#222}
header{position:sticky;top:0;z-index:10;background:#2874f0;color:#fff;padding:12px}
.top{display:flex;align-items:center;gap:10px}.logo{font-size:22px;font-weight:800;white-space:nowrap}
.search{flex:1;background:#fff;border:0;border-radius:6px;padding:11px 12px;font-size:15px;outline:0}
.icon{font-size:24px;cursor:pointer}.hero{margin:10px;border-radius:12px;padding:22px;background:linear-gradient(135deg,#dbeafe,#fff);box-shadow:0 2px 8px #ddd}
.hero h1{margin:0 0 8px;font-size:25px}.hero p{margin:0 0 15px;color:#555}.btn{border:0;border-radius:7px;background:#ff9f00;color:#111;font-weight:700;padding:10px 15px}
.section{padding:8px 10px}.section h2{font-size:19px;margin:8px 0 12px}.cats{display:flex;gap:10px;overflow:auto;padding-bottom:5px}.cat{min-width:85px;background:#fff;border-radius:10px;padding:12px 6px;text-align:center;box-shadow:0 1px 5px #ddd;font-size:12px}.cat div{font-size:27px;margin-bottom:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 5px #ddd;position:relative}.pic{height:125px;background:#eef3f8;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:60px}.card h3{font-size:14px;margin:9px 0 5px}.price{font-size:18px;font-weight:800}.old{text-decoration:line-through;color:#888;font-size:12px;margin-left:5px}.rating{color:#e28a00;font-size:12px}.add{width:100%;margin-top:8px;padding:9px;border:0;border-radius:6px;background:#ffd814;font-weight:700}.heart{position:absolute;right:12px;top:12px;border:0;background:#fff;border-radius:50%;font-size:18px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 4px 9px;z-index:20}nav button{border:0;background:none;font-size:11px;color:#444}nav span{display:block;font-size:20px;margin-bottom:2px}
main{padding-bottom:70px}.hidden{display:none}.back{border:0;background:none;font-size:22px;margin-bottom:5px}.detail{background:#fff;margin:10px;padding:15px;border-radius:12px}.detail .bigpic{height:230px;background:#eef3f8;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:100px}.detail h1{font-size:21px}.qty{display:flex;align-items:center;gap:12px;margin:12px 0}.qty button{width:34px;height:34px;border:1px solid #ccc;background:#fff;border-radius:6px}.cartrow{background:#fff;margin:8px 10px;padding:12px;border-radius:10px;display:flex;gap:10px;align-items:center}.cartrow .thumb{width:65px;height:65px;background:#eef3f8;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:35px}.empty{text-align:center;padding:50px 20px;color:#777}.total{background:#fff;margin:10px;padding:15px;border-radius:10px;font-size:19px;font-weight:bold;display:flex;justify-content:space-between}
</style>
</head>
<body>
<header>
 <div class="top">
  <div class="logo">Hidayath Mart</div>
  <input id="search" class="search" placeholder="Search products..." oninput="renderProducts()">
  <div class="icon" onclick="showPage('cart')">🛒<sup id="cartCount">0</sup></div>
 </div>
</header>

<main id="homePage">
 <div class="hero">
  <h1>Welcome to Hidayath Mart</h1>
  <p>Great products. Great prices. Simple shopping.</p>
  <button class="btn" onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
 </div>
 <section class="section">
  <h2>Categories</h2>
  <div class="cats">
   <div class="cat" onclick="filterCat('All')"><div>🛍️</div>All</div>
   <div class="cat" onclick="filterCat('Electronics')"><div>📱</div>Electronics</div>
   <div class="cat" onclick="filterCat('Fashion')"><div>👕</div>Fashion</div>
   <div class="cat" onclick="filterCat('Home')"><div>🏠</div>Home</div>
   <div class="cat" onclick="filterCat('Beauty')"><div>💄</div>Beauty</div>
  </div>
 </section>
 <section class="section" id="products">
  <h2>Popular Products</h2>
  <div id="productGrid" class="grid"></div>
 </section>
</main>

<section id="detailPage" class="hidden"></section>
<section id="cartPage" class="hidden"></section>
<section id="wishlistPage" class="hidden"></section>

<nav>
 <button onclick="showPage('home')"><span>🏠</span>Home</button>
 <button onclick="document.getElementById('search').focus()"><span>🔍</span>Search</button>
 <button onclick="showPage('wishlist')"><span>❤️</span>Wishlist</button>
 <button onclick="showPage('cart')"><span>🛒</span>Cart</button>
 <button onclick="alert('Profile demo — login can be added later.')"><span>👤</span>Account</button>
</nav>

<script>
const products=[
{id:1,name:"Wireless Headphones",cat:"Electronics",price:1499,old:2499,emoji:"🎧",rating:"4.4"},
{id:2,name:"Smart Watch",cat:"Electronics",price:1999,old:3499,emoji:"⌚",rating:"4.3"},
{id:3,name:"Men's Casual Shirt",cat:"Fashion",price:799,old:1299,emoji:"👕",rating:"4.2"},
{id:4,name:"Running Shoes",cat:"Fashion",price:1299,old:1999,emoji:"👟",rating:"4.5"},
{id:5,name:"Table Lamp",cat:"Home",price:699,old:999,emoji:"💡",rating:"4.1"},
{id:6,name:"Coffee Mug Set",cat:"Home",price:499,old:799,emoji:"☕",rating:"4.6"},
{id:7,name:"Face Care Kit",cat:"Beauty",price:899,old:1399,emoji:"🧴",rating:"4.3"},
{id:8,name:"Backpack",cat:"Fashion",price:999,old:1599,emoji:"🎒",rating:"4.4"}
];
let cart=JSON.parse(localStorage.getItem('hm_cart')||'[]'), wishlist=JSON.parse(localStorage.getItem('hm_wish')||'[]'), category='All';

function save(){localStorage.setItem('hm_cart',JSON.stringify(cart));localStorage.setItem('hm_wish',JSON.stringify(wishlist));updateCount()}
function updateCount(){document.getElementById('cartCount').textContent=cart.reduce((a,x)=>a+x.qty,0)}
function filterCat(c){category=c;showPage('home');renderProducts()}
function renderProducts(){
 const q=document.getElementById('search').value.toLowerCase();
 const list=products.filter(p=>(category==='All'||p.cat===category)&&p.name.toLowerCase().includes(q));
 document.getElementById('productGrid').innerHTML=list.map(p=>card(p)).join('')||'<div class="empty">No products found.</div>';
}
function card(p){return `<div class="card"><button class="heart" onclick="toggleWish(${p.id})">${wishlist.includes(p.id)?'❤️':'♡'}</button><div class="pic" onclick="showDetail(${p.id})">${p.emoji}</div><h3 onclick="showDetail(${p.id})">${p.name}</h3><div class="rating">★ ${p.rating}</div><div class="price">₹${p.price.toLocaleString()} <span class="old">₹${p.old.toLocaleString()}</span></div><button class="add" onclick="addCart(${p.id})">Add to Cart</button></div>`}
function addCart(id){let x=cart.find(i=>i.id===id);x?x.qty++:cart.push({id,qty:1});save();alert('Added to cart!')}
function toggleWish(id){wishlist.includes(id)?wishlist=wishlist.filter(x=>x!==id):wishlist.push(id);save();renderProducts()}
function showDetail(id){let p=products.find(x=>x.id===id);document.querySelectorAll('main,#detailPage,#cartPage,#wishlistPage').forEach(x=>x.classList.add('hidden'));let d=document.getElementById('detailPage');d.classList.remove('hidden');d.innerHTML=`<div class="detail"><button class="back" onclick="showPage('home')">←</button><div class="bigpic">${p.emoji}</div><h1>${p.name}</h1><div class="rating">★ ${p.rating} customer rating</div><h2>₹${p.price.toLocaleString()}</h2><p>Special introductory offer. Free delivery demo. Product details can be connected to a real inventory later.</p><button class="add" onclick="addCart(${p.id})">Add to Cart</button><button class="add" style="background:#ff9f00" onclick="buyNow(${p.id})">Buy Now</button></div>`}
function buyNow(id){addCart(id);showPage('cart')}
function showPage(page){
 document.querySelectorAll('main,#detailPage,#cartPage,#wishlistPage').forEach(x=>x.classList.add('hidden'));
 if(page==='home'){document.getElementById('homePage').classList.remove('hidden');renderProducts()}
 if(page==='cart'){let el=document.getElementById('cartPage');el.classList.remove('hidden');renderCart()}
 if(page==='wishlist'){let el=document.getElementById('wishlistPage');el.classList.remove('hidden');renderWish()}
 window.scrollTo(0,0)
}
function renderCart(){let el=document.getElementById('cartPage');if(!cart.length){el.innerHTML='<div class="empty"><h2>🛒 Your cart is empty</h2><p>Add products to get started.</p><button class="btn" onclick="showPage(\\'home\\')">Continue Shopping</button></div>';return}let total=0;el.innerHTML='<div class="section"><h2>Shopping Cart</h2></div>'+cart.map(i=>{let p=products.find(x=>x.id===i.id);total+=p.price*i.qty;return `<div class="cartrow"><div class="thumb">${p.emoji}</div><div style="flex:1"><b>${p.name}</b><div>₹${p.price.toLocaleString()} × ${i.qty}</div><button onclick="changeQty(${p.id},-1)">−</button> <button onclick="changeQty(${p.id},1)">+</button></div></div>`}).join('')+`<div class="total"><span>Total</span><span>₹${total.toLocaleString()}</span></div><div class="section"><button class="add" onclick="checkout()">Proceed to Checkout</button></div>`}
function changeQty(id,n){let x=cart.find(i=>i.id===id);x.qty+=n;if(x.qty<=0)cart=cart.filter(i=>i.id!==id);save();renderCart()}
function checkout(){alert('Demo checkout successful! Payment gateway and real orders can be connected in the next version.');cart=[];save();showPage('home')}
function renderWish(){let el=document.getElementById('wishlistPage'),list=products.filter(p=>wishlist.includes(p.id));el.innerHTML='<div class="section"><h2>❤️ My Wishlist</h2></div>'+(list.length?'<div class="grid">'+list.map(p=>card(p)).join('')+'</div>':'<div class="empty">Your wishlist is empty.</div>')}
updateCount();renderProducts();
</script>
</body>
</html>
